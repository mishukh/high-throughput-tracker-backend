worker_rlimit_nofile 20000;

events {
    worker_connections 10000;
}

http {
    upstream ingestion_cluster {
        keepalive 64;
        server ingestion-api-1:8080;
        server ingestion-api-2:8080;
        server ingestion-api-3:8080;
    }

    upstream query_cluster {
        keepalive 64;
        server query-api:8081;
    }

    server {
        listen 80;
        
        location /nginx_status {
            stub_status;
            allow all;
        }

        location /api/v1/telemetry {
            proxy_pass http://ingestion_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/ {
            proxy_pass http://query_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
